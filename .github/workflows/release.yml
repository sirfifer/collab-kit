# On a version tag: build the source archive, generate CycloneDX and SPDX SBOMs, attest build
# provenance and the SBOM, and publish a GitHub release with all of it attached.
name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(cat VERSION)" = "$TAG"
      - name: The public example matches this kit (examples/the-kit-itself)
        run: python3 tests/public_example.py check
      - name: Source archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="${GITHUB_REPOSITORY#*/}-${TAG#v}"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: ${{ env.NAME }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ env.NAME }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.ARCHIVE }}
          sbom-path: ${{ env.NAME }}.cdx.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes \
            "$ARCHIVE" "$NAME.cdx.json" "$NAME.spdx.json"
