<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="480" height="520" role="img" aria-labelledby="t d">
  <title id="t">Collab Kit: one loop</title>
  <desc id="d">A loop of four parts around a folder. You talk, hands-free. Claude, in voice mode, reads the folder and writes a return into it. The back end, scripts with no AI, files the return. Your agents start from a brief of what is waiting, and their questions come back to you. In the middle is the folder: plain files in your own drive, which Claude, the back end and the agents all read and write. You never touch it.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2430; text-anchor: middle; }
      .title { font-size: 28px; font-weight: 700; text-anchor: start; }
      .h { font-size: 18px; font-weight: 700; }
      .s { font-size: 16px; fill: #5B6472; }
      .card { fill: #FFFFFF; stroke: #D8D3C8; stroke-width: 1.5; }
      .go { font-size: 16px; font-weight: 700; fill: #0F766E; }
      .back { font-size: 16px; font-weight: 700; fill: #4338CA; }
      .arc { fill: none; stroke: #0F766E; stroke-width: 3; }
      .arcb { fill: none; stroke: #4338CA; stroke-width: 3; }
      .spoke { stroke: #9AA3B2; stroke-width: 2; stroke-dasharray: 3 4; }
      .foot { font-size: 16px; fill: #5B6472; text-anchor: start; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0F766E"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4338CA"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="480" height="520" rx="20" fill="#FBFAF7"/>
  <text x="24" y="50" class="title">One loop</text>

  <!-- the ring: what travels -->
  <path d="M332 112 Q388 112 388 208" class="arc" marker-end="url(#a)"/>
  <path d="M388 292 Q388 392 334 392" class="arc" marker-end="url(#a)"/>
  <path d="M148 392 Q92 392 92 296" class="arc" marker-end="url(#a)"/>
  <path d="M92 208 Q92 112 146 112" class="arcb" marker-end="url(#b)"/>

  <text x="420" y="150" class="go">you talk</text>
  <text x="418" y="352" class="go">a return</text>
  <text x="62" y="352" class="go">a brief</text>
  <text x="16" y="100" class="back" style="text-anchor:start">their questions</text>

  <!-- spokes: who reads and writes the folder -->
  
  <line x1="164" y1="250" x2="176" y2="250" class="spoke"/>
  <line x1="304" y1="250" x2="316" y2="250" class="spoke"/>
  <line x1="240" y1="296" x2="240" y2="358" class="spoke"/>

  <!-- you -->
  <rect x="150" y="78" width="180" height="68" rx="14" fill="#1F2430"/>
  <text x="240" y="108" class="h" style="fill:#F5F3EE">You</text>
  <text x="240" y="130" class="s" style="fill:#C9CFDA">talking, hands-free</text>

  <!-- claude -->
  <rect x="316" y="212" width="152" height="76" rx="14" class="card"/>
  <text x="392" y="244" class="h">Claude</text>
  <text x="392" y="267" class="s">in voice mode</text>

  <!-- back end -->
  <rect x="150" y="358" width="180" height="68" rx="14" class="card"/>
  <text x="240" y="388" class="h">The back end</text>
  <text x="240" y="410" class="s">scripts only, no AI</text>

  <!-- agents -->
  <rect x="12" y="212" width="152" height="76" rx="14" class="card"/>
  <text x="88" y="244" class="h">Your agents</text>
  <text x="88" y="267" class="s">in your projects</text>

  <!-- the folder -->
  <rect x="176" y="204" width="128" height="92" rx="14" fill="#1F2937"/>
  <text x="240" y="238" class="h" style="fill:#F5F3EE;font-size:17px">The folder</text>
  <text x="240" y="260" class="s" style="fill:#C9CFDA;font-size:15.5px">plain files in</text>
  <text x="240" y="278" class="s" style="fill:#C9CFDA;font-size:15.5px">your own drive</text>

  <text x="24" y="464" class="foot">Everything passes through the folder. You never</text>
  <text x="24" y="486" class="foot">open it: you talk, and the rest is filed for you.</text>
</svg>
