<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1760" width="640" height="1760" role="img" aria-labelledby="t d">
  <title id="t">How Collab Kit works</title>
  <desc id="d">One loop in five parts. You talk. Claude, in voice mode, opens only the files the talk needs and writes back a return. The Collab Kit folder in your cloud drive holds the agenda, the knowledge, the inbox of returns and work in progress. A back end made only of scripts applies returns within minutes and keeps each project's repository in step. AI agents in your projects start every session with a brief and put their questions on your agenda.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2430; }
      .title { font-size: 34px; font-weight: 700; }
      .sub { font-size: 18px; fill: #5B6472; }
      .h { font-size: 24px; font-weight: 700; }
      .b { font-size: 18px; }
      .s { font-size: 16px; }
      .muted { fill: #5B6472; }
      .num { font-size: 18px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .card { fill: #FFFFFF; stroke: #D8D3C8; stroke-width: 1.5; }
      .pill { fill: #F1EEE7; }
      .say { font-size: 17px; font-style: italic; }
      .down { fill: #0F766E; font-size: 17px; font-weight: 700; }
      .up { fill: #4338CA; font-size: 17px; font-weight: 700; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .lt { fill: #F5F3EE; }
      .ltm { fill: #C9CFDA; }
      .foot { font-size: 21px; font-weight: 700; }
    </style>
  </defs>

  <rect x="0" y="0" width="640" height="1760" rx="20" fill="#FBFAF7"/>

  <!-- header -->
  <text x="32" y="60" class="title">How Collab Kit works</text>
  <text x="32" y="94" class="sub">One loop: your voice at one end, your projects at the</text>
  <text x="32" y="118" class="sub">other, and plain files that you own in between.</text>

  <!-- 1. you -->
  <rect x="24" y="150" width="592" height="166" rx="16" class="card"/>
  <circle cx="58" cy="188" r="17" fill="#1F2430"/>
  <text x="58" y="194" class="num">1</text>
  <text x="88" y="196" class="h">You, talking</text>
  <text x="48" y="234" class="b">Hands-free. No screen, no typing, nothing to attach.</text>
  <rect x="48" y="254" width="180" height="40" rx="20" class="pill"/>
  <text x="138" y="280" class="say" text-anchor="middle">&#8220;What's pressing?&#8221;</text>
  <rect x="240" y="254" width="340" height="40" rx="20" class="pill"/>
  <text x="410" y="280" class="say" text-anchor="middle">&#8220;Let's get into the garden planner.&#8221;</text>

  <!-- 1 to 2 -->
  <line x1="320" y1="334" x2="320" y2="358" stroke="#5B6472" stroke-width="2.5"/>
  <polygon points="313,335 327,335 320,323" fill="#5B6472"/>
  <polygon points="313,357 327,357 320,369" fill="#5B6472"/>
  <text x="340" y="352" class="s muted">one spoken conversation</text>

  <!-- 2. claude -->
  <rect x="24" y="376" width="592" height="252" rx="16" class="card"/>
  <circle cx="58" cy="414" r="17" fill="#1F2430"/>
  <text x="58" y="420" class="num">2</text>
  <text x="88" y="422" class="h">Claude, in voice mode</text>
  <text x="48" y="458" class="b">Opens only what the talk needs, in this order:</text>

  <rect x="48" y="474" width="104" height="36" rx="18" class="pill"/>
  <text x="100" y="498" class="s" text-anchor="middle">start file</text>
  <text x="163" y="498" class="s muted" text-anchor="middle">&#8594;</text>
  <rect x="174" y="474" width="144" height="36" rx="18" class="pill"/>
  <text x="246" y="498" class="s" text-anchor="middle">what's pressing</text>
  <text x="329" y="498" class="s muted" text-anchor="middle">&#8594;</text>
  <rect x="340" y="474" width="128" height="36" rx="18" class="pill"/>
  <text x="404" y="498" class="s" text-anchor="middle">your projects</text>
  <text x="479" y="498" class="s muted" text-anchor="middle">&#8594;</text>

  <rect x="48" y="520" width="184" height="36" rx="18" class="pill"/>
  <text x="140" y="544" class="s" text-anchor="middle">the project's agenda</text>
  <text x="243" y="544" class="s muted" text-anchor="middle">&#8594;</text>
  <rect x="254" y="520" width="96" height="36" rx="18" class="pill"/>
  <text x="302" y="544" class="s" text-anchor="middle">its index</text>
  <text x="361" y="544" class="s muted" text-anchor="middle">&#8594;</text>
  <rect x="372" y="520" width="120" height="36" rx="18" fill="#E0E7FF"/>
  <text x="432" y="544" class="s" text-anchor="middle">one section</text>

  <text x="48" y="588" class="b">Then writes a return: a small text file that says</text>
  <text x="48" y="612" class="b">what was decided and what is new.</text>

  <!-- 2 to 3 -->
  <line x1="80" y1="636" x2="80" y2="676" stroke="#0F766E" stroke-width="3"/>
  <polygon points="72,675 88,675 80,688" fill="#0F766E"/>
  <text x="98" y="670" class="down">returns</text>
  <line x1="330" y1="692" x2="330" y2="652" stroke="#4338CA" stroke-width="3"/>
  <polygon points="322,653 338,653 330,640" fill="#4338CA"/>
  <text x="348" y="670" class="up">agenda + knowledge</text>

  <!-- 3. the folder -->
  <rect x="24" y="700" width="592" height="316" rx="16" fill="#1F2937"/>
  <circle cx="58" cy="738" r="17" fill="#F5F3EE"/>
  <text x="58" y="744" class="num" style="fill:#1F2937">3</text>
  <text x="88" y="746" class="h lt">The Collab Kit folder</text>
  <text x="48" y="780" class="b ltm">Plain files in your own cloud drive.</text>

  <rect x="48" y="798" width="262" height="84" rx="10" fill="#2F3B4F"/>
  <text x="64" y="830" class="b mono lt" font-weight="700">agenda/</text>
  <text x="64" y="852" class="s ltm">what needs you,</text>
  <text x="64" y="871" class="s ltm">one file per item</text>

  <rect x="330" y="798" width="262" height="84" rx="10" fill="#2F3B4F"/>
  <text x="346" y="830" class="b mono lt" font-weight="700">knowledge/</text>
  <text x="346" y="852" class="s ltm">what each project knows,</text>
  <text x="346" y="871" class="s ltm">indexed, in small files</text>

  <rect x="48" y="894" width="262" height="84" rx="10" fill="#2F3B4F"/>
  <text x="64" y="926" class="b mono lt" font-weight="700">_returns/</text>
  <text x="64" y="948" class="s ltm">the inbox: what talks</text>
  <text x="64" y="967" class="s ltm">and agents worked out</text>

  <rect x="330" y="894" width="262" height="84" rx="10" fill="#2F3B4F"/>
  <text x="346" y="926" class="b mono lt" font-weight="700">WIP/</text>
  <text x="346" y="948" class="s ltm">checkpoint notes</text>
  <text x="346" y="967" class="s ltm">between saves</text>

  <text x="48" y="1002" class="s ltm">The same four folders at the top and in every project.</text>

  <!-- 3 to 4 -->
  <line x1="80" y1="1024" x2="80" y2="1064" stroke="#0F766E" stroke-width="3"/>
  <polygon points="72,1063 88,1063 80,1076" fill="#0F766E"/>
  <text x="98" y="1058" class="down">new returns</text>
  <line x1="330" y1="1080" x2="330" y2="1040" stroke="#4338CA" stroke-width="3"/>
  <polygon points="322,1041 338,1041 330,1028" fill="#4338CA"/>
  <text x="348" y="1058" class="up">updated agenda + knowledge</text>

  <!-- 4. the back end -->
  <rect x="24" y="1088" width="592" height="264" rx="16" class="card"/>
  <circle cx="58" cy="1126" r="17" fill="#1F2430"/>
  <text x="58" y="1132" class="num">4</text>
  <text x="88" y="1134" class="h">The back end</text>
  <rect x="262" y="1110" width="176" height="32" rx="16" fill="none" stroke="#0F766E" stroke-width="1.5"/>
  <text x="350" y="1131" class="s" text-anchor="middle" style="fill:#0F766E;font-weight:700">scripts only, no AI</text>
  <text x="48" y="1170" class="b muted">One always-on machine, or a scheduled cloud run.</text>
  <circle cx="56" cy="1198" r="4" fill="#0F766E"/>
  <text x="72" y="1204" class="b">Checks the inboxes every minute</text>
  <circle cx="56" cy="1226" r="4" fill="#0F766E"/>
  <text x="72" y="1232" class="b">Applies each return whole, or not at all</text>
  <circle cx="56" cy="1254" r="4" fill="#0F766E"/>
  <text x="72" y="1260" class="b">Rebuilds the front page: what's pressing</text>
  <circle cx="56" cy="1282" r="4" fill="#0F766E"/>
  <text x="72" y="1288" class="b">Keeps each project's repository in step</text>
  <rect x="48" y="1304" width="544" height="34" rx="8" fill="#FEF3C7"/>
  <text x="62" y="1327" class="s" style="fill:#92400E;font-weight:700">Something critical? One push to your phone.</text>

  <!-- 4 to 5 -->
  <line x1="80" y1="1360" x2="80" y2="1400" stroke="#0F766E" stroke-width="3"/>
  <polygon points="72,1399 88,1399 80,1412" fill="#0F766E"/>
  <text x="98" y="1394" class="down">decisions, new items</text>
  <line x1="330" y1="1416" x2="330" y2="1376" stroke="#4338CA" stroke-width="3"/>
  <polygon points="322,1377 338,1377 330,1364" fill="#4338CA"/>
  <text x="348" y="1394" class="up">status, questions, documents</text>

  <!-- 5. projects and agents -->
  <rect x="24" y="1424" width="592" height="228" rx="16" class="card"/>
  <circle cx="58" cy="1462" r="17" fill="#1F2430"/>
  <text x="58" y="1468" class="num">5</text>
  <text x="88" y="1470" class="h">Your projects, and their AI agents</text>
  <text x="48" y="1506" class="b muted">In git repositories, or entirely in the folder.</text>
  <text x="48" y="1540" class="b">Every agent session opens with a brief: what you</text>
  <text x="48" y="1564" class="b">decided, what is waiting, what is in progress.</text>
  <text x="48" y="1598" class="b">Its questions land on your agenda, unasked.</text>
  <text x="48" y="1632" class="s muted">Today you start each agent session yourself.</text>

  <!-- footer -->
  <text x="32" y="1700" class="foot">Dictated on a phone, on the agenda about three</text>
  <text x="32" y="1728" class="foot">minutes later, with no one at a keyboard.</text>
</svg>
