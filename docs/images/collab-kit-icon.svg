<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Collab Kit</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2052"/>
      <stop offset="1" stop-color="#0B0F2B"/>
    </linearGradient>
    <clipPath id="agent">
      <rect x="384" y="150" width="500" height="410" rx="120"/>
      <path d="M700 520 L878 700 L840 470 Z"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Agent bubble (back, upper right), tail points down-right -->
  <g fill="#2EE6C8">
    <rect x="384" y="150" width="500" height="410" rx="120"/>
    <path d="M700 520 L878 700 L840 470 Z"/>
  </g>
  <g fill="#0B0F2B">
    <circle cx="548" cy="268" r="38"/>
    <circle cx="662" cy="268" r="38"/>
    <circle cx="776" cy="268" r="38"/>
  </g>

  <!-- Person bubble (front, lower left), cut out of the agent bubble by a gap, tail down-left -->
  <g clip-path="url(#agent)" fill="#10153A" stroke="#10153A" stroke-width="72" stroke-linejoin="round">
    <rect x="140" y="390" width="500" height="410" rx="120"/>
    <path d="M330 760 L150 940 L190 700 Z"/>
  </g>
  <g fill="#FFC53D">
    <rect x="140" y="390" width="500" height="410" rx="120"/>
    <path d="M330 760 L150 940 L190 700 Z"/>
  </g>

  <!-- Voice bars -->
  <g stroke="#0B0F2B" stroke-width="58" stroke-linecap="round">
    <line x1="252" y1="560" x2="252" y2="630"/>
    <line x1="344" y1="500" x2="344" y2="690"/>
    <line x1="436" y1="530" x2="436" y2="660"/>
    <line x1="528" y1="575" x2="528" y2="615"/>
  </g>
</svg>
