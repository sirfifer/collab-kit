# Collab Kit back end on GitHub Actions: level 2 without a machine (DESIGN-0.5 section 9).
#
# UNTESTED against a live Drive as of 0.5.0: it needs (1) a separate Google account for the bot,
# shared as editor on the Collab Kit folder only, (2) your own Google OAuth client, published to
# production (rclone's shared client stops working in 2026; Testing grants expire after a week),
# and (3) an rclone config for that account, stored as the repository secret RCLONE_CONF; and the
# repository variables COLLAB_KIT_OWNER (the Google account that OWNS the Collab Kit folder: each run
# checks that it owns the folder's start file, so the bot's own address would be refused) and
# COLLAB_KIT_HUMAN (the person's name). See docs/rclone-intake.md.
#
# It runs hourly with no minute-by-minute check, so returns are applied within the hour, not within
# minutes as on a machine, and it keeps no heartbeat file (agenda/00-HEARTBEAT.md): the front page
# gives the time of the last run, and says the back end is down when that is over 70 minutes old.
#
# Put this file in a PRIVATE repository of your own (the runner repository) as
# .github/workflows/collab-kit-backend.yml. It runs the kit at a pinned commit; it handles units whose
# home is the Collab Kit folder (repository-homed projects need a machine runner, which can push).
name: collab-kit-backend
on:
  schedule:
    - cron: "17 * * * *"          # hourly; well inside the free tier for a private repository
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collab-kit-backend      # one runner at a time here; the lease guards against other runners
  cancel-in-progress: false
jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIT_REF: v0.5.3              # a tag or commit of the kit; bump deliberately (0.5.2's account check could never pass)
      RCLONE_VERSION: v1.76.0
      RCLONE_SHA256: b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7   # linux-amd64, from rclone.lock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OWNER/collab-kit          # the kit's repository
          ref: ${{ env.KIT_REF }}
          path: kit
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install rclone (pinned, checksum verified, never selfupdate)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo rclone.zip "https://downloads.rclone.org/$RCLONE_VERSION/rclone-$RCLONE_VERSION-linux-amd64.zip"
          echo "$RCLONE_SHA256  rclone.zip" | sha256sum -c -
          unzip -joq rclone.zip "rclone-$RCLONE_VERSION-linux-amd64/rclone" -d "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/rclone" version | head -1 | grep -qx "rclone $RCLONE_VERSION"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Configure (the rclone config from a secret, mode 0600)
        shell: bash
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          OWNER_ACCOUNT: ${{ vars.COLLAB_KIT_OWNER }}
          HUMAN: ${{ vars.COLLAB_KIT_HUMAN }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$RCLONE_CONF" > "$RUNNER_TEMP/rclone.conf"
          cat > "$RUNNER_TEMP/backend.toml" <<EOF
          [backend]
          cloud = "rclone:gdrive:Collab Kit"
          work = "$RUNNER_TEMP/work"
          interval_minutes = 60
          human = "$HUMAN"
          account = "$OWNER_ACCOUNT"
          lease_settle_seconds = 20
          EOF
      - name: One pass
        shell: bash
        env:
          COLLAB_KIT_RCLONE_CONFIG: ${{ runner.temp }}/rclone.conf
          COLLAB_KIT_STATE: ${{ runner.temp }}/state
        run: python kit/engine/ck.py backend run --config "$RUNNER_TEMP/backend.toml"
